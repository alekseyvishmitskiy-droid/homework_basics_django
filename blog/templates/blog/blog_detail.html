{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'blog:list' %}">Блог</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ post.title }}</li>
        </ol>
    </nav>

    <div class="card shadow-sm mt-3">
        {% if post.preview %}
            <img src="{{ post.preview.url }}" class="img-fluid rounded-top" alt="{{ post.title }}" style="max-height: 400px; width: 100%; object-fit: cover;">
        {% endif %}
        <div class="card-body">
            <h1 class="card-title mb-3">{{ post.title }}</h1>
            <p class="text-muted mb-4">Создано: {{ post.created_at|date:"d.m.Y H:i" }} | 👁 Просмотров: {{ post.views_count }}</p>
            <div class="card-text mb-4" style="white-space: pre-wrap;">{{ post.content }}</div>

            <div class="d-flex gap-2">
                <a href="{% url 'blog:update' post.pk %}" class="btn btn-warning">Редактировать</a>
                <a href="{% url 'blog:delete' post.pk %}" class="btn btn-danger">Удалить</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
