<div class="d-flex flex-wrap align-items-center justify-content-between">
    <div>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:home' %}">Каталог</a>


        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-success me-2" href="{% url 'catalog:product_create' %}">Добавить товар</a>
        {% endif %}

        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-info me-2" href="{% url 'blog:list' %}">Блог</a>
    </div>


    <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-secondary me-2" href="{% url 'users:profile' %}">
                Профиль ({{ user.email }})
            </a>


            <form method="post" action="{% url 'users:logout' %}" class="m-0 p-0">
                {% csrf_token %}
                <button type="submit" class="p-2 btn btn-danger">Выйти</button>
            </form>
        {% else %}

            <a class="p-2 btn btn-primary me-2" href="{% url 'users:login' %}">Войти</a>
            <a class="p-2 btn btn-success" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</div>
