{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore | Главная{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{% static 'bootstrap.min.css' %}">
</head>
<body class="bg-light">

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
    <h5 class="my-0 me-md-auto font-weight-normal fw-bold">Skystore</h5>
    <nav class="ms-md-5">
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
    </nav>
</div>


<main>
    {% block content %}
    {% endblock %}
</main>

<div class="container">
    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <div class="row">
            <div class="col-12 col-md mb-3 mb-md-0">
                <span class="fw-bold">SkyStore</span>
                <small class="d-block mb-3 text-muted">&copy; {% now "Y" %}</small>
            </div>
            <div class="col-6 col-md">
                <h5>Категории</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted text-decoration-none" href="#">Рассылки</a></li>
                    <li><a class="text-muted text-decoration-none" href="#">Телеграм боты</a></li>
                    <li><a class="text-muted text-decoration-none" href="#">Полезные утилиты</a></li>
                    <li><a class="text-muted text-decoration-none" href="#">Веб-приложения</a></li>
                    <li><a class="text-muted text-decoration-none" href="#">Микросервисы</a></li>
                </ul>
            </div>
            <div class="col-6 col-md">
                <h5>Дополнительно</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted text-decoration-none" href="#">Мы пишем</a></li>
                </ul>
            </div>
            <div class="col-6 col-md">
                <h5>О нас</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted text-decoration-none" href="{% url 'catalog:contacts' %}">Контакты</a></li>
                </ul>
            </div>
        </div>
    </footer>
</div>

</body>
</html>
